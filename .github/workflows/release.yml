# ============================================================================
# GitHub Actions - Release Workflow
# Part of Professional Development Terminal Setup
# ============================================================================
# Automates releases when version tags are pushed.
#
# Attestation continuity (B2.3): a release may publish only for a commit
# SHA whose full Buildkite gate set ran green and which carries a recorded
# attestation. The attest-guard job below fails closed unless
#   - a manual dispatch supplies `attested_sha` equal to the release tag's
#     commit, or
#   - a tag push carries a committed `.release-attested-<sha>` marker in
#     its tree (content == name, sha an ancestor of the tag commit).
#
# Release-commit binding (REL-PROV): attest-guard also emits `release_sha`
# (the release tag's commit). Every other job that checks out code checks
# out exactly that SHA — never github.ref, which on workflow_dispatch is
# the dispatching BRANCH — and the build job asserts HEAD == release_sha
# before archiving, so the tree that is tested, archived, signed, and
# published is the attested/tagged commit.
#
# Signing (P1-6): the `sign` job signs the final checksums.txt and both
# SBOMs with cosign KEYLESS (GitHub OIDC, no stored key) and verifies the
# signatures against this workflow's identity before the release job may
# publish. Least privilege: contents: read everywhere except the release
# job (contents: write); id-token: write only in the sign job.
# Procedure: docs/RELEASE_CHECKLIST.md.
# ============================================================================

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3)'
        required: true
        type: string
      attested_sha:
        description: 'Full 40-hex commit SHA attested for this release; must equal the release tag commit (docs/RELEASE_CHECKLIST.md)'
        required: false
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  # Least privilege (P1-6): every job defaults to read-only. A job-level
  # permissions block REPLACES this default entirely; only `release`
  # (creates the GitHub Release: contents: write) and `sign` (cosign
  # keyless OIDC token: id-token: write) declare more.
  contents: read

jobs:
  # ========================================
  # Attestation Guard (B2.3) — first job, fail-closed
  # ========================================
  # Nothing else in this workflow may run until the release SHA is
  # attested. Two admission paths, both failing closed:
  #   1. workflow_dispatch: the `attested_sha` input is REQUIRED and must
  #      equal the commit of tag v<version> (strict equality).
  #   2. tag push: the tag's tree must contain a marker
  #      `.release-attested-<sha>` whose content equals <sha> and whose
  #      sha is an ancestor of the tag commit. (The marker names the
  #      attested parent commit — a self-referential marker for the tag
  #      commit itself is impossible, since committing the file changes
  #      the SHA it would name. See docs/RELEASE_CHECKLIST.md.)
  # It also emits `release_sha` (REL-PROV): the commit every downstream
  # job checks out. Dispatch: the tag commit (== attested_sha). Tag push:
  # the tag's peeled commit. Fails closed unless it is a full 40-hex SHA.
  attest-guard:
    name: Attestation Guard
    runs-on: ubuntu-latest
    outputs:
      attested_sha: ${{ steps.guard.outputs.attested_sha }}
      release_sha: ${{ steps.guard.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Enforce release attestation
        id: guard
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_INPUT_VERSION: ${{ github.event.inputs.version }}
          GH_INPUT_ATTESTED_SHA: ${{ github.event.inputs.attested_sha }}
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          RELEASE_SHA=""

          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ]; then
            # Path 1: explicit attestation input, strict equality with the
            # release tag's commit. Absent input fails closed.
            if [ -z "$GH_INPUT_ATTESTED_SHA" ]; then
              fail "attested_sha input is required for a manual release dispatch (docs/RELEASE_CHECKLIST.md: record the Buildkite-green SHA and pass it here)."
            fi
            printf '%s' "$GH_INPUT_ATTESTED_SHA" \
              | grep -Eq '^[0-9a-f]{40}$' \
              || fail "attested_sha must be a full 40-hex commit SHA (got: '$GH_INPUT_ATTESTED_SHA')."
            git rev-parse --verify --quiet "v${GH_INPUT_VERSION}^{commit}" >/dev/null \
              || fail "Tag v${GH_INPUT_VERSION} does not exist; tag the attested commit first (docs/RELEASE_CHECKLIST.md)."
            TAG_SHA="$(git rev-parse "v${GH_INPUT_VERSION}^{commit}")"
            if [ "$TAG_SHA" != "$GH_INPUT_ATTESTED_SHA" ]; then
              fail "Attestation mismatch: tag v${GH_INPUT_VERSION} points at ${TAG_SHA} but attested_sha is ${GH_INPUT_ATTESTED_SHA}. Release refused."
            fi
            ATTESTED="$GH_INPUT_ATTESTED_SHA"
            # REL-PROV: the release commit is the tag commit (== attested).
            # github.ref here is the dispatching BRANCH and must not be
            # what downstream jobs build.
            RELEASE_SHA="$TAG_SHA"
          else
            # Path 2: tag push — attestation marker must exist in the tag's
            # tree, name itself consistently, and sit in the tag's history.
            RELEASE_SHA="$(git rev-parse "${GH_REF}^{commit}")"
            # The marker scan below reads the working tree, so it must be
            # the tag's tree (fails closed if the tag moved after the push).
            [ "$(git rev-parse HEAD)" = "$RELEASE_SHA" ] \
              || fail "Checkout HEAD $(git rev-parse HEAD) is not the commit of ${GH_REF} (${RELEASE_SHA}). Release refused."
            ATTESTED=""
            for f in .release-attested-*; do
              [ -f "$f" ] || continue
              name="${f#.release-attested-}"
              printf '%s' "$name" | grep -Eq '^[0-9a-f]{40}$' || continue
              content="$(tr -d '[:space:]' < "$f")"
              if [ "$name" = "$content" ]; then
                if git merge-base --is-ancestor "$name" HEAD 2>/dev/null; then
                  ATTESTED="$name"
                  break
                fi
              fi
            done
            if [ -z "$ATTESTED" ]; then
              fail "No attestation marker: tag ${GH_REF} (commit ${RELEASE_SHA}) contains no .release-attested-<sha> marker naming an ancestor commit. Release refused — follow docs/RELEASE_CHECKLIST.md."
            fi
          fi

          echo "attested_sha=$ATTESTED" >> "$GITHUB_OUTPUT"
          echo "Release attested for SHA: $ATTESTED"

          # REL-PROV: emit the release commit for every downstream checkout.
          # Fail closed on anything that is not a full 40-hex commit SHA.
          printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || fail "release_sha is empty or not a full 40-hex commit SHA (got: '$RELEASE_SHA'). Release refused."
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Release commit (built, tested, signed, published): $RELEASE_SHA"

  # ========================================
  # Validate Release
  # ========================================
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    needs: [attest-guard]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.attest-guard.outputs.release_sha }}
          fetch-depth: 0

      - name: Get version
        id: version
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$GH_INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Validate version format
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            echo "Expected format: X.Y.Z (e.g., 1.2.3)"
            exit 1
          fi

      - name: Check package.json version
        run: |
          PKG_VERSION=$(grep -o '"version": *"[^"]*"' package.json | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+')
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION). Bump package.json before tagging."
            exit 1
          fi

  # ========================================
  # Run Tests
  # ========================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [attest-guard, validate]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.attest-guard.outputs.release_sha }}

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run syntax check
        run: make syntax-check

      - name: Run ShellCheck
        run: make lint  # Gating: releases must not ship code that fails lint (P0-1)

      - name: Run tests
        run: make test

  # ========================================
  # Secret Scan (gitleaks) — release-path gate (M5)
  # ========================================
  # M5 clause "gitleaks+pre-commit in release path": a tagged push must not
  # bypass the CI gates. Invocation mirrors .github/workflows/test.yml
  # (same commands, same SHA-pinned actions). This job gates build/release
  # via build.needs — no artifact is built or published if it fails.
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    needs: [attest-guard]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.attest-guard.outputs.release_sha }}
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================
  # Pre-commit Hooks — release-path gate (M5)
  # ========================================
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    needs: [attest-guard]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.attest-guard.outputs.release_sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck shfmt
          pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  # ========================================
  # Build Release
  # ========================================
  build:
    name: Build Release
    runs-on: ubuntu-latest
    # Gating (ENGINEERING_RULES 6.1): the attestation guard, secret-scan,
    # and pre-commit jobs above must pass BEFORE any artifact is built or
    # published.
    needs: [attest-guard, validate, test, secret-scan, pre-commit]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.attest-guard.outputs.release_sha }}
          fetch-depth: 0

      - name: Assert checkout is the release commit
        # REL-PROV: the archives below are made from the working tree, so
        # the working tree must be exactly the attested release commit —
        # HEAD equal to attest-guard's release_sha and no local changes.
        # Fails closed before any archive exists.
        env:
          RELEASE_SHA: ${{ needs.attest-guard.outputs.release_sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::release_sha from attest-guard is not a full 40-hex SHA (got: '$RELEASE_SHA'). Refusing to build."
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::Checked-out HEAD ${HEAD_SHA} is not the release commit ${RELEASE_SHA}. Refusing to build."
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::Working tree differs from release commit ${RELEASE_SHA}. Refusing to build."
            git status --porcelain --untracked-files=all
            exit 1
          fi
          echo "Building release commit: $HEAD_SHA"

      - name: Create release archive
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          # Create distribution directory
          mkdir -p dist

          # Attribution and security policy ship with every release (P1-10
          # remainder; ENGINEERING_RULES 7.2). FontPatcher/ATTRIBUTION.md is
          # the authoritative per-component license table.
          cp FontPatcher/ATTRIBUTION.md dist/ATTRIBUTION.md
          cp docs/SECURITY.md dist/SECURITY.md

          # Create tarball (excluding dev files). Agent scratch/evidence files
          # (tmp_rovodev_*) and local outputs (coverage/, test-results/,
          # patched-fonts/) never ship.
          tar -czf "dist/version-manager-suite-${VERSION}.tar.gz" \
            --exclude='.git' \
            --exclude='dist' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='alldocs' \
            --exclude='.cursor' \
            --exclude='.codacy' \
            --exclude='.vscode' \
            --exclude='tmp_rovodev_*' \
            --exclude='coverage' \
            --exclude='test-results' \
            --exclude='patched-fonts' \
            .

          # Create zip
          zip -r "dist/version-manager-suite-${VERSION}.zip" . \
            -x '.git/*' \
            -x 'dist/*' \
            -x 'node_modules/*' \
            -x '.github/*' \
            -x 'tests/*' \
            -x 'alldocs/*' \
            -x '.cursor/*' \
            -x '.codacy/*' \
            -x '.vscode/*' \
            -x 'tmp_rovodev_*' \
            -x 'coverage/*' \
            -x 'test-results/*' \
            -x 'patched-fonts/*'

      - name: Generate SBOM
        # M5 "SBOM/signing" clause. Deterministic SPDX-lite SBOM (no
        # timestamps — two runs must be byte-identical); font glyph-set
        # licenses are mapped mechanically from FontPatcher/ATTRIBUTION.md.
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          ./scripts/release-sbom.sh --version "$VERSION" --output dist/sbom.spdx.txt
          cat dist/sbom.spdx.txt

      - name: Create checksums
        run: |
          # Checksum-verified release (M5): checksums.txt covers EVERY
          # artifact published next to it — the tarball, the zip, the
          # attribution copy, the security policy, and the SBOM — so a
          # consumer can verify the whole set with one `sha256sum -c`
          # (procedure documented in docs/MAINTENANCE.md). checksums.txt
          # itself is excluded: it cannot self-checksum. This build-time
          # manifest is regenerated over the complete set (adding the Syft
          # SBOM) in the `sign` job, and that signed manifest is the one
          # that ships.
          cd dist
          find . -maxdepth 1 -type f ! -name 'checksums.txt' -printf '%P\n' \
            | LC_ALL=C sort | xargs -r sha256sum > checksums.txt
          cat checksums.txt

          echo "Created release artifacts:"
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: release-artifacts
          path: dist/

  # ========================================
  # SBOM (Syft SPDX) of the release artifacts — P1-6, ENABLED
  # ========================================
  # The build job already ships a deterministic source SBOM
  # (scripts/release-sbom.sh -> sbom.spdx.txt). This job adds a
  # tool-generated SPDX SBOM of the BUILT artifacts, produced by Syft.
  # Syft is installed from a pinned release with an inline, verified
  # sha256 (ENGINEERING_RULES 7.1: pinned + checksum-verified + logged).
  # The sign job folds this SBOM into checksums.txt so the published
  # checksum manifest still covers every published asset.
  sbom:
    name: SBOM (Syft SPDX)
    runs-on: ubuntu-latest
    needs: [attest-guard, validate, build]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.attest-guard.outputs.release_sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4.1.9
        with:
          name: release-artifacts
          path: dist/

      - name: Install pinned Syft (checksum-verified)
        # Pin verified 2026-10-05 (lane C3): digest below was cross-checked
        # against the upstream-published syft_1.54.0_checksums.txt and an
        # independent download of the tarball.
        env:
          SYFT_VERSION: 1.54.0
          SYFT_SHA256: 54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/syft.tgz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tgz" | sha256sum -c -
          tar -xzf /tmp/syft.tgz -C /tmp syft
          sudo install -m 0755 /tmp/syft /usr/local/bin/syft
          syft version

      - name: Generate SPDX SBOM of the release artifacts
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          syft dir:dist \
            --source-name "version-manager-suite" \
            --source-version "$VERSION" \
            -o spdx-json=dist/sbom-syft.spdx.json
          # Log the catalog result (ENGINEERING_RULES 7.1) and sanity-check
          # the SPDX document before it is attached to the release.
          python3 - <<'PY'
          import json
          doc = json.load(open("dist/sbom-syft.spdx.json"))
          assert doc["spdxVersion"] == "SPDX-2.3", doc["spdxVersion"]
          print("SPDX OK:", doc["name"], "- packages:", len(doc.get("packages", [])))
          PY

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: sbom-syft
          path: dist/sbom-syft.spdx.json
          if-no-files-found: error

  # ========================================
  # Artifact Signing — cosign KEYLESS (GitHub OIDC) — P1-6, ENABLED
  # ========================================
  # Owner decision: keyless signing via the runner's GitHub OIDC token; no
  # long-lived key exists anywhere. This job
  #   1. finalizes checksums.txt over the complete published set (moved
  #      here from the release job so the SIGNED manifest is the one that
  #      ships),
  #   2. signs checksums.txt (which transitively covers every archive and
  #      document it lists) and both SBOMs, writing one Sigstore bundle
  #      (certificate + signature + Rekor inclusion proof) per file,
  #   3. verifies every bundle against this repository's release.yml
  #      identity and the GitHub OIDC issuer — fail-closed, BEFORE the
  #      signed set is handed to the release job.
  # The .bundle files stay OUTSIDE checksums.txt by design: they sign it.
  # Only this job holds id-token: write; it cannot write repository
  # contents. Consumer procedure: docs/RELEASE_CHECKLIST.md.
  sign:
    name: Sign Release (cosign keyless)
    runs-on: ubuntu-latest
    needs: [attest-guard, validate, build, sbom]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.attest-guard.outputs.release_sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4.1.9
        with:
          name: release-artifacts
          path: dist/

      - name: Download Syft SBOM
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4.1.9
        with:
          name: sbom-syft
          path: dist/

      - name: Finalize checksums over the full published set
        # checksums.txt must cover EVERY asset published next to it except
        # the .bundle files, which sign it
        # (M5 / ENGINEERING_RULES 7): the build job wrote checksums before
        # the Syft SBOM existed, so regenerate deterministically over the
        # complete dist/ set here — same command, same sort order — BEFORE
        # any .bundle exists. This final manifest is what gets signed, what
        # ships with the release, and what the changelog embeds.
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name 'checksums.txt' -printf '%P\n' \
            | LC_ALL=C sort | xargs -r sha256sum > checksums.txt
          cat checksums.txt

      - name: Install cosign
        # Action pinned by full commit SHA (ENGINEERING_RULES 6.2), verified
        # with `git ls-remote https://github.com/sigstore/cosign-installer
        # 'refs/tags/v3.10.1*'` -> 7e8b541eb2e61bf99390e1afd4be13a184e9ebc5
        # (lightweight tag: no ^{} entry, so this is the commit). The
        # installer's action.yml at that SHA bootstraps cosign v2.6.1 and
        # checks it against an inline sha256 embedded in the pinned action
        # (cosign-linux-amd64: 064954c5d8c7e3b28188eee5b1727b31c411550bc5fefd41aa672d3c761d103a);
        # pinning `cosign-release` to that same bootstrap version means the
        # installed binary is exactly the inline-checksum-verified one
        # (ENGINEERING_RULES 7.1). cosign v2.6.1 tag verified upstream
        # (refs/tags/v2.6.1^{} -> 634fabe54f9fbbab55d821a83ba93b2d25bdba5f).
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          cosign-release: 'v2.6.1'

      - name: Sign checksums and SBOMs (cosign keyless)
        # Fulcio issues a short-lived certificate bound to this workflow's
        # identity (https://github.com/<owner>/<repo>/.github/workflows/
        # release.yml@<ref>, issuer https://token.actions.githubusercontent.com);
        # Rekor records the signature. Both land in <file>.bundle.
        run: |
          set -euo pipefail
          cosign version
          for f in checksums.txt sbom.spdx.txt sbom-syft.spdx.json; do
            cosign sign-blob --yes --bundle "dist/${f}.bundle" "dist/${f}"
          done

      - name: Verify signatures (fail-closed self-check)
        # The exact identity policy a consumer applies
        # (docs/RELEASE_CHECKLIST.md "Artifact signing"): a bundle that does
        # not verify against this repository's release.yml identity and the
        # GitHub OIDC issuer fails the job, so nothing unverifiable reaches
        # the release job.
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Escape dots in owner/repo for regexp use (repo names may contain
          # dots); the workflow path and issuer are fixed.
          REPO_ESC="$(printf '%s' "$GH_REPOSITORY" | sed 's/\./\\./g')"
          IDENTITY_REGEXP="^https://github\.com/${REPO_ESC}/\.github/workflows/release\.yml@"
          for f in checksums.txt sbom.spdx.txt sbom-syft.spdx.json; do
            cosign verify-blob \
              --bundle "dist/${f}.bundle" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "$IDENTITY_REGEXP" \
              "dist/${f}"
          done
          echo "Signed release set:"
          ls -la dist/

      - name: Upload signed release set
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: release-signed
          path: dist/
          if-no-files-found: error

  # ========================================
  # Create GitHub Release
  # ========================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Only job that mutates repository state: it creates the GitHub Release
    # and uploads its assets. It publishes exactly the signed set produced
    # (and self-verified) by the sign job.
    permissions:
      contents: write
    needs: [attest-guard, validate, sign]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.attest-guard.outputs.release_sha }}
          fetch-depth: 0

      - name: Download signed release set
        # Pin re-verified against upstream (git ls-remote, 2026-10-04, lane R):
        # the previous SHA cc203385981b70fc5b5a049660dfcf82b0d4277c does not
        # exist in the repo's history; this is the true v4.1.9 peeled commit.
        # `release-signed` is the complete, signature-verified set from the
        # sign job (checksums finalized there; bundles outside checksums).
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806  # v4.1.9
        with:
          name: release-signed
          path: dist/

      - name: Generate changelog
        id: changelog
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # Generate changelog
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi

          # Create release notes
          cat > release-notes.md << EOF
          ## Version $VERSION

          ### Changes

          $CHANGES

          ### Installation

          \`\`\`bash
          # Clone the repository
          git clone https://github.com/$GH_REPOSITORY.git
          cd version-management-setup

          # Run setup
          ./setup.sh
          \`\`\`

          ### Checksums

          \`\`\`
          $(cat dist/checksums.txt)
          \`\`\`

          ---
          **Full Changelog**: https://github.com/$GH_REPOSITORY/compare/${PREV_TAG:-v0.0.0}...v$VERSION
          EOF

          echo "Release notes generated"

      - name: Create release
        # Pin re-verified against upstream (git ls-remote, 2026-10-04, lane R):
        # the previous SHA da05d552573bd3b6bfc93ebc9fccf1c9dc5bf54e does not
        # exist in the repo's history; this is the true v2.2.2 peeled commit.
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631  # v2.2.2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: v${{ needs.validate.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          # dist/*.bundle = the cosign keyless signature bundles (P1-6) for
          # checksums.txt and both SBOMs. They are outside checksums.txt by
          # design (they sign it); consumers verify them with
          # `cosign verify-blob --bundle` (docs/RELEASE_CHECKLIST.md).
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/sbom.spdx.txt
            dist/sbom-syft.spdx.json
            dist/ATTRIBUTION.md
            dist/SECURITY.md
            dist/*.bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "**Version:** v${{ needs.validate.outputs.version }}"
            echo ""
            echo "**Attested SHA:** ${{ needs.attest-guard.outputs.attested_sha }}"
            echo ""
            echo "### Artifacts"
            echo ""
            ls -la dist/
          } >> "$GITHUB_STEP_SUMMARY"

  # ========================================
  # Post-Release Notifications
  # ========================================
  notify:
    name: Post-Release
    runs-on: ubuntu-latest
    needs: [attest-guard, validate, release]
    if: success()
    steps:
      - name: Success notification
        env:
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          echo "✅ Release v${{ needs.validate.outputs.version }} published successfully!"
          echo ""
          echo "Release URL: https://github.com/$GH_REPOSITORY/releases/tag/v${{ needs.validate.outputs.version }}"
