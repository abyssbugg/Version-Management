# =============================================================================
# Buildkite CI pipeline — version-management-setup
# =============================================================================
# Migrated from .github/workflows/test.yml (2026-10-02). Buildkite is the
# sole AUTOMATIC CI engine; the GitHub Actions twin is a manual-only
# fallback (workflow_dispatch) so the two engines never double-fire.
#
# Gate parity with the pre-migration workflow:
#   ShellCheck lint (warning severity) · fail-closed syntax gate ·
#   pre-commit · gitleaks secret scan · test matrix (Linux + macOS)
#
# M0 addition: every test step emits the canonical test manifest
# (tests/emit-manifest.sh via `make test`) and uploads it as a per-OS
# artifact — Buildkite is an evidence producer for the manifest-parity
# GO condition. artifact_paths matching no files fails the step, which
# keeps the evidence chain fail-closed.
# =============================================================================

steps:
  - group: ":mag: Linting & Validation"
    key: "lint-group"
    steps:
      - label: ":shell: ShellCheck Lint"
        key: "lint"
        command: |
          # Provision the hosted Linux agent (idempotent): the fail-closed
          # lint gate requires shellcheck.
          command -v shellcheck >/dev/null 2>&1 || {
            apt-get update -qq
            apt-get install -y -qq shellcheck
          }
          ./scripts/lint-shell.sh -- --severity=warning
        agents:
          queue: "linux-small"

      - label: ":white_check_mark: Syntax Validation"
        key: "syntax"
        command: |
          # Provision the hosted Linux agent (idempotent): the fail-closed
          # syntax gate verifies shipped Zsh assets with zsh -n.
          command -v zsh >/dev/null 2>&1 || {
            apt-get update -qq
            apt-get install -y -qq zsh
          }
          make syntax-check
        agents:
          queue: "linux-small"

      - label: ":hook: Pre-commit Hooks"
        key: "pre-commit"
        command: |
          command -v pre-commit >/dev/null 2>&1 || pip3 install --quiet pre-commit
          pre-commit run --all-files --show-diff-on-failure
        agents:
          queue: "linux-small"

      - label: ":lock: Secret Scan (gitleaks)"
        key: "secret-scan"
        command: |
          git fetch --unshallow || true
          command -v gitleaks >/dev/null 2>&1 || {
            echo "installing pinned gitleaks v8.28.0"
            curl -fsSL -o /tmp/gitleaks.tgz \
              https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
            tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
            install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          }
          gitleaks detect --verbose --redact
        agents:
          queue: "linux-small"

  # Test steps depend only on lint + syntax — mirroring the pre-migration
  # GitHub workflow (needs: [shellcheck, syntax-check]). pre-commit and
  # gitleaks run in parallel and do not gate the test matrix; pre-commit is
  # green since build #31 (the M5 lanes closed its last finding — the stale
  # "expected red" note that lived here was retired 2026-10-04).
  - group: ":test_tube: Tests (canonical manifest per OS)"
    key: "test-group"
    steps:
      - label: ":penguin: Tests (Linux)"
        key: "test-linux"
        depends_on: ["lint", "syntax"]
        command: |
          command -v zsh >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq zsh; }
          # gate_meta's B1.7 case exercises the real zero-tolerance quality
          # gate (make validate), which now fails closed without shellcheck.
          command -v shellcheck >/dev/null 2>&1 || { apt-get update -qq && apt-get install -y -qq shellcheck; }
          make test
        artifact_paths:
          - "test-results/manifest.json"
          - "test-results/manifest.tsv"
        agents:
          queue: "linux-small"

      - label: ":apple: Tests (macOS)"
        key: "test-macos"
        depends_on: ["lint", "syntax"]
        command: |
          command -v shellcheck >/dev/null 2>&1 || { brew install --quiet shellcheck; }
          make test
        artifact_paths:
          - "test-results/manifest.json"
          - "test-results/manifest.tsv"
        agents:
          queue: "macos-medium"

      # B2.6/P1-11 remainder: REAL line coverage (kcov) replacing the
      # pseudo-coverage signal. The unit suite runs under kcov with
      # --include-path=lib into coverage/, which is uploaded as an artifact
      # (matching-no-files fails the step, keeping this evidence fail-closed
      # like the manifest artifacts). Linux-only: apt kcov is the canonical
      # lane; `make coverage-kcov` fails closed locally without kcov.
      - label: ":chart_with_upwards_trend: Coverage (kcov, unit suite)"
        key: "coverage-kcov"
        depends_on: ["lint", "syntax"]
        command: |
          # Provision the hosted Linux agent (idempotent), mirroring the
          # other steps' provisioning pattern.
          if ! command -v kcov >/dev/null 2>&1 || ! command -v zsh >/dev/null 2>&1 || ! command -v shellcheck >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq kcov zsh shellcheck
          fi
          make coverage-kcov
        artifact_paths:
          - "coverage/**"
        agents:
          queue: "linux-small"

  - group: ":receipt: Release attestation (release-attest)"
    key: "release-attest-group"
    # Group-level `if:` is unsupported by this schema (build #34: group marked
    # "broken" with no log) — the condition lives on the STEP below.
    steps:
      - label: ":receipt: Verify release attestation"
        key: "release-attest"
        if: build.env("RELEASE_ATTEST_SHA") != null
        command: |
          set -euo pipefail
          fail() { echo "+++ ATTESTATION FAILED: $1"; exit 1; }

          SHA="${RELEASE_ATTEST_SHA:-}"
          TAG="${RELEASE_ATTEST_TAG:-}"

          # (a) Record the attested release SHA (fail-closed on malformed input).
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || fail "RELEASE_ATTEST_SHA must be a full 40-hex commit SHA (got: '$SHA')."
          mkdir -p release-attestation
          printf '%s\n' "$SHA" > release-attestation/attested-sha.txt
          [ -n "$TAG" ] && printf '%s\n' "$TAG" > release-attestation/attested-tag.txt || true
          echo "Attesting release SHA: $SHA (tag: ${TAG:-<not supplied — gate check only>})"

          # (b) Assert the full gate set ran green on this SHA in Buildkite.
          #     Requires BUILDKITE_ACCESS_TOKEN (present on Buildkite agents
          #     during builds). Without it the check fails closed — run the
          #     documented `bk build list` procedure locally instead
          #     (docs/RELEASE_CHECKLIST.md).
          if [ -z "${BUILDKITE_ACCESS_TOKEN:-}" ]; then
            fail "BUILDKITE_ACCESS_TOKEN not available in this build environment; perform the manual gate assertion with 'bk build list --pipeline ${BUILDKITE_PIPELINE_SLUG:-version-management}' per docs/RELEASE_CHECKLIST.md and re-run with the token present."
          fi
          curl -sSf -H "Authorization: Bearer $BUILDKITE_ACCESS_TOKEN" \
            "https://api.buildkite.com/v2/organizations/${BUILDKITE_ORGANIZATION_SLUG}/pipelines/${BUILDKITE_PIPELINE_SLUG}/builds?commit=${SHA}&per_page=100" \
            -o /tmp/bk-builds.json
          BUILD_URL="$(python3 - <<'PY'
          import json, os, sys
          builds = json.load(open("/tmp/bk-builds.json"))
          sha = os.environ["RELEASE_ATTEST_SHA"]
          required = {"lint", "syntax", "pre-commit", "secret-scan", "test-linux", "test-macos", "coverage-kcov"}
          for b in builds:
              if b.get("commit") != sha or b.get("state") != "passed":
                  continue
              passed = {j.get("step_key") for j in b.get("jobs", [])
                        if j.get("state") == "passed" and j.get("step_key")}
              if required <= passed:
                  print(b["web_url"])
                  sys.exit(0)
          sys.exit(1)
          PY
          )" || fail "No passed Buildkite build with the full gate set (lint/syntax/pre-commit/secret-scan/test-linux/test-macos/coverage-kcov) found for SHA $SHA."
          echo "$BUILD_URL" > release-attestation/gate-build-url.txt
          echo "Full gate set green on $SHA: $BUILD_URL"

          # (c) After the GitHub release publishes: the release tag's commit
          #     on origin must equal the attested SHA (fail-closed when no
          #     tag was supplied).
          if [ -z "$TAG" ]; then
            fail "RELEASE_ATTEST_TAG not supplied; post-publish tag continuity check could not run. Re-run after publishing with RELEASE_ATTEST_TAG set."
          fi
          PEELED="$(git ls-remote origin "refs/tags/${TAG}^{}" | awk 'NR==1{print $1}')"
          DIRECT="$(git ls-remote origin "refs/tags/${TAG}" | awk 'NR==1{print $1}')"
          TARGET="${PEELED:-$DIRECT}"
          [ -n "$TARGET" ] || fail "Tag ${TAG} not found on origin."
          if [ "$TARGET" != "$SHA" ]; then
            fail "Release tag ${TAG} points at ${TARGET}, expected attested SHA ${SHA}."
          fi
          echo "Release tag ${TAG} commit == attested SHA: OK"
          {
            echo "attested_sha=$SHA"
            echo "attested_tag=$TAG"
            echo "gate_build=$BUILD_URL"
            echo "tag_commit=$TARGET"
          } > release-attestation/report.txt
          cat release-attestation/report.txt
        artifact_paths:
          - "release-attestation/*"
        agents:
          queue: "linux-small"
