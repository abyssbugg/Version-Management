# ============================================================================
# Pre-commit Configuration
# Part of Professional Development Terminal Setup
# ============================================================================
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# ============================================================================

repos:
  # ShellCheck - Static analysis for shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: [--severity=warning, --shell=bash]
        types: [shell]
        exclude: |
          (?x)^(
            config/.*\.zsh$|
            \.p10k\.zsh$
          )$

  # Shell script formatting
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.7.0-4
    hooks:
      - id: shfmt
        args: [-i, "4", -ci, -bn]
        types: [shell]
        exclude: |
          (?x)^(
            config/.*\.zsh$
          )$

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Prevent large files
      - id: check-added-large-files
        args: [--maxkb=1000]
        exclude: ".*\\.ttf$"

      # Fix end of file
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
            FontPatcher/.*|
            .*\.ttf$|
            .*\.md$
          )$

      # Fix trailing whitespace
      - id: trailing-whitespace
        exclude: |
          (?x)^(
            FontPatcher/.*|
            .*\.ttf$|
            .*\.md$
          )$

      # Check YAML syntax
      - id: check-yaml
        args: [--unsafe]

      # Check JSON syntax
      - id: check-json

      # Detect private keys
      - id: detect-private-key

      # Check for merge conflicts
      - id: check-merge-conflict

      # Check executables have shebangs
      - id: check-executables-have-shebangs

      # Check shell script syntax
      - id: check-shebang-scripts-are-executable
        exclude: "^FontPatcher/"  # vendored third-party content

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [--fix, --disable, MD013, MD033, MD041, --]
        exclude: |
          (?x)^(
            alldocs/.*|
            docs/archive/.*|
            docs/analysis/.*|
            docs/plans/.*|
            FontPatcher/.*|
            tempdocs/.*|
            CHANGELOG\.md$
          )$

# ============================================================================
# Local Hooks (Project-specific)
# ============================================================================
  - repo: local
    hooks:
      # Syntax check all shell scripts
      - id: bash-syntax
        name: Bash Syntax Check
        entry: bash -n
        language: system
        types: [shell]
        exclude: ".*\\.zsh$"

      # Check for hardcoded secrets patterns
      - id: no-secrets
        name: Check for hardcoded secrets
        entry: scripts/check-no-secrets.sh
        language: script
        types: [shell]
        pass_filenames: true
        # Exit 1 when secrets are found (grep matched), exit 0 when clean.
        # Using a wrapper script so the logic is clearly inverted and testable.
        verbose: true

# ============================================================================
# Configuration
# ============================================================================
default_language_version:
  python: python3

# Run hooks on commit
default_stages: [pre-commit]

# Fail fast on first error
fail_fast: false

# Minimum pre-commit version
minimum_pre_commit_version: "3.0.0"
